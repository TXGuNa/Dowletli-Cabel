<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F7FF" />
    <title>DÖWLETLI | Optic Cable</title>

    <!-- Last theme's background + logo for the splash (see src/content/themes.ts) -->
    <script>
      try {
        var boot = JSON.parse(localStorage.getItem('dowletli_boot') || '{}');
        if (location.pathname.indexOf('/admin') !== 0 && !/[?&]preview/.test(location.search)) {
          if (/^#[0-9a-fA-F]{6}$/.test(boot.bg || '')) document.documentElement.style.setProperty('--boot-bg', boot.bg);
          if (/^#[0-9a-fA-F]{6}$/.test(boot.primary || '')) document.documentElement.style.setProperty('--boot-accent', boot.primary);
        }
        window.__DOWLETLI_LOGO__ = typeof boot.logo === 'string' && /^(\/|https:)/.test(boot.logo) ? boot.logo : '';
      } catch (e) {}
    </script>

    <!-- Start loading the published site content right away (used by src/content/siteSync.ts) -->
    <script>
      window.__DOWLETLI_SITE__ = fetch('/api/site', { cache: 'no-store' })
        .then(function (r) { return r.status === 200 ? r.json() : null; })
        .catch(function () { return null; });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />

    <style>
      /* Paint the brand background immediately so the first frame is never white.
         --boot-bg / --boot-accent come from the last theme seen (script below). */
      html, body { margin: 0; background: var(--boot-bg, #F3F7FF); }

      /* Boot splash shown until React mounts and replaces #root */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--boot-bg, #F3F7FF);
        z-index: 9999;
      }
      #app-splash img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      #app-splash .ring {
        width: 30px;
        height: 30px;
        border-radius: 9999px;
        border: 3px solid rgba(37, 99, 235, 0.18);
        border-top-color: var(--boot-accent, #2563EB);
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img, #app-splash .ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img id="app-splash-logo" src="/assets/logo.png" alt="Döwletli" />
        <script>if (window.__DOWLETLI_LOGO__) document.getElementById('app-splash-logo').src = window.__DOWLETLI_LOGO__;</script>
        <div class="ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
